<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market-Hub</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="#">Market-<span>Hub</span></a>
        </div>
        <nav class="nav" id="nav">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#categories">Categories</a>
            <a href="#Sell">Sell Products</a>
            <a href="#about">About</a>
        </nav>
        <div class="header-actions">
            <button class="cart-button" id="cartButton">
                cart <span id="cartCount">0</span>
            </button>
            <button class="menu-button" id="menuButton">
                <span class="material-symbols-outlined">
                    menu
                </span>

            </button>

        </div>

    </header>

    <main>
        <section class="hero" id="home">
            <div class="hero-content">
                <h2>Welcome to Market-Hub</h2>
                <h3>Buy & Sell Products <span>Near You</span></h3>
                <p>Discover products from local sellers and find exactly what you need at affordable prices.</p>
            </div>
            <div class="heroBtn">
                <a href="#product" class="primaryBtn">Browse Products</a>
                <a href="#sell" class="secondaryBtn">Sell Your Products</a>

            </div>

        </section>

    </main>

    <footer>

    </footer>
    <script src="/script.js"></script>
    
</body>
</html>
